    // ── BARRA DE AVISOS ───────────────────────────────────────
    function BarraDeAvisos({ items, pinnedIds, t, onComplete, onAhoraNo, onEnviarAlChat, onDesfijar, onTogglePin, onRemove }) {
      const [menuTarget, setMenuTarget] = useState(null); // { item, isPinned, pos }

      const urgentes = items.filter(i => {
        if (i.status === "done") return false;
        const days = getDaysUntil(i.datetime || i.deadline);
        return days !== null && days >= 0 && days <= 1;
      });

      const fijados = items.filter(i => i.status !== "done" && pinnedIds.includes(i.id));

      if (urgentes.length === 0 && fijados.length === 0) return null;

      return (
        <>
          <div style={{ flexShrink: 0, borderBottom: `1px solid ${t.navBorder}`, background: t.navBg }}>
            {urgentes.length > 0 && (
              <div style={{ padding: "6px 14px 5px" }}>
                <span style={{ fontSize: 10, color: t.textFaint, fontWeight: 600, display: "block", marginBottom: 4 }}>
                  vencen pronto
                </span>
                <div style={{ display: "flex", gap: 6, overflowX: "auto" }}>
                  {urgentes.map(item => {
                    const days = getDaysUntil(item.datetime || item.deadline);
                    return (
                      <AvisoBlock
                        key={item.id} item={item}
                        sub={days === 0 ? "hoy" : "mañana"}
                        t={t} tinted={false}
                        onLongPress={(pos) => setMenuTarget({ item, isPinned: pinnedIds.includes(item.id), pos })}
                      />
                    );
                  })}
                </div>
              </div>
            )}
            {fijados.length > 0 && (
              <>
                {urgentes.length > 0 && <div style={{ height: 1, background: t.border, margin: "0 14px" }} />}
                <div style={{ padding: "5px 14px 6px" }}>
                  <span style={{ fontSize: 10, color: t.textFaint, fontWeight: 600, display: "block", marginBottom: 4 }}>
                    fijados por ti
                  </span>
                  <div style={{ display: "flex", gap: 6, overflowX: "auto" }}>
                    {fijados.map(item => (
                      <AvisoBlock
                        key={item.id} item={item}
                        sub="fijado"
                        t={t} tinted={true}
                        onLongPress={(pos) => setMenuTarget({ item, isPinned: true, pos })}
                      />
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>

          {menuTarget && (
            <ContextMenu
              item={menuTarget.item}
              t={t}
              pos={menuTarget.pos}
              onClose={() => setMenuTarget(null)}
              options={[
                { label: "Completada",    action: () => onComplete(menuTarget.item.id) },
                { label: menuTarget.isPinned ? "Desfijar tarea" : "Fijar tarea", action: () => onTogglePin(menuTarget.item.id) },
                { label: "Enviar al chat", action: () => onEnviarAlChat(menuTarget.item) },
                { label: "Ahora no",      action: () => onAhoraNo(menuTarget.item.id) },
                { label: "Eliminar",      danger: true, action: () => onRemove(menuTarget.item.id) },
              ]}
            />
          )}
        </>
      );
    }

    // ── APP ───────────────────────────────────────────────────
    function App() {
      const [items,          setItems]          = useState([]);
      const [messages,       setMessages]       = useState([]);
      const [dark,           setDark]           = useState(false);
      const [loaded,         setLoaded]         = useState(false);
      const [screen,         setScreen]         = useState("home");
      const [activeCategory, setActiveCategory] = useState("diario");
      const [highlights,     setHighlights]     = useState([]);
      const [profile,        setProfile]        = useState(emptyProfile());
      const [restrictions,   setRestrictions]   = useState([]);
      const [motorState,     setMotorState]     = useState(null);
      const [feedback,       setFeedback]       = useState([]);
      const [observations,   setObservations]   = useState([]);
      const [session,        setSession]        = useState(null);
      const [authChecked,    setAuthChecked]    = useState(false);
      const [apiKeyOverride, setApiKeyOverride] = useState(null); // tras guardar desde ApiKeyPrompt
      const [pinnedIds,      setPinnedIds]      = useState([]);
      const [attachedChip,   setAttachedChip]   = useState(null);
      const [detailItemId,   setDetailItemId]   = useState(null);
      const motorEvalRef = useRef(false);

      const apiKey = apiKeyOverride
        || session?.user?.user_metadata?.anthropic_api_key
        || null;

      const t = dark ? DARK : LIGHT;

      useEffect(() => {
        let mounted = true;

        sb.auth.getSession().then(({ data }) => {
          if (!mounted) return;
          setSession(data.session ?? null);
          setAuthChecked(true);
        });

        const { data: sub } = sb.auth.onAuthStateChange((_event, newSession) => {
          if (!mounted) return;
          setSession(newSession ?? null);
          if (!newSession) {
            // logout: resetear estado React a vacío
            setItems([]); setMessages([]); setDark(false); setScreen("home");
            setActiveCategory("diario"); setHighlights([]); setProfile(emptyProfile());
            setRestrictions([]); setMotorState(null); setFeedback([]);
            setPinnedIds([]); setObservations([]); setAttachedChip(null);
            setApiKeyOverride(null);
            setLoaded(false);
          }
        });

        return () => { mounted = false; sub.subscription.unsubscribe(); };
      }, []);

      useEffect(() => {
        if (!session) return;
        const userId      = session.user.id;
        const accessToken = session.access_token;

        (async () => {
          await initStorage(userId, accessToken);
          const [si, sm, sp, spr, srest, smot, sfb, spin, sobs] = await Promise.all([
            storageGet(STORAGE_ITEMS),
            storageGet(STORAGE_MESSAGES),
            storageGet(STORAGE_PREFS),
            storageGet(STORAGE_PROFILE),
            storageGet(STORAGE_RESTRICTIONS),
            storageGet(STORAGE_MOTOR),
            storageGet(STORAGE_FEEDBACK),
            storageGet(STORAGE_PINNED),
            storageGet(STORAGE_OBSERVATIONS),
          ]);

          if (Array.isArray(si)) setItems(si);
          if (Array.isArray(sm)) setMessages(sm);
          if (sp?.dark !== undefined) setDark(sp.dark);

          if (spr) {
            if (typeof spr === "string") {
              setProfile({ ...emptyProfile(), context: spr });
            } else {
              setProfile({ ...emptyProfile(), ...spr });
            }
          }

          if (Array.isArray(srest)) setRestrictions(srest);
          if (Array.isArray(sfb)) setFeedback(sfb);
          if (Array.isArray(spin)) setPinnedIds(spin);
          if (Array.isArray(sobs)) setObservations(sobs);

          if (!smot) {
            const initial = emptyMotor();
            await storageSet(STORAGE_MOTOR, initial);
            setMotorState(initial);
          } else {
            const merged = { ...emptyMotor(), ...smot };
            // Migración: "active" era la fase inicial antigua, ahora se llama "observing"
            if (merged.phase === "active") merged.phase = "observing";
            await storageSet(STORAGE_MOTOR, merged);
            setMotorState(merged);
          }

          setLoaded(true);
        })();
      }, [session?.user?.id, session?.access_token]);

      useEffect(() => { if (loaded) storageSet(STORAGE_ITEMS,        items);        }, [items,        loaded]);
      useEffect(() => { if (loaded) storageSet(STORAGE_MESSAGES,     messages);     }, [messages,     loaded]);
      useEffect(() => { if (loaded) storageSet(STORAGE_PREFS,        { dark });     }, [dark,         loaded]);
      useEffect(() => { if (loaded) storageSet(STORAGE_PROFILE,      profile);      }, [profile,      loaded]);
      useEffect(() => { if (loaded) storageSet(STORAGE_RESTRICTIONS, restrictions); }, [restrictions, loaded]);
      useEffect(() => { if (loaded) storageSet(STORAGE_FEEDBACK,     feedback);     }, [feedback,     loaded]);
      useEffect(() => { if (loaded) storageSet(STORAGE_PINNED,       pinnedIds);    }, [pinnedIds,    loaded]);
      useEffect(() => { if (loaded) storageSet(STORAGE_OBSERVATIONS, observations); }, [observations, loaded]);

      const commitItem = useCallback((text, label, category, extra = {}) => {
        const recStr = typeof extra.recurrence === "string" ? extra.recurrence : null;
        setItems(prev => [{
          id: Date.now(), text, label, category, notes: "",
          status: "pending", createdAt: Date.now(),
          ...extra, recurrence: recStr,
        }, ...prev]);
      }, []);

      const pushMessage = useCallback((role, text) => {
        setMessages(prev => [...prev, { id: Date.now() + Math.random(), role, text, createdAt: new Date().toISOString() }]);
      }, []);

      const advance = useCallback((id) => setItems(prev => prev.map(i => {
        if (i.id !== id) return i;
        if (i.status === "done") return { ...i, status: "pending" };
        return { ...i, status: { pending: "doing", doing: "done" }[i.status] || i.status };
      })), []);

      const remove = useCallback((id) => setItems(prev => prev.filter(i => i.id !== id)), []);

      const togglePin = useCallback((id) => {
        setPinnedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      }, []);

      const markDone = useCallback((id) => {
        setItems(prev => prev.map(i => i.id === id ? { ...i, status: "done" } : i));
        setPinnedIds(prev => prev.filter(x => x !== id));
      }, []);

      const ahoraNo = useCallback((id) => {
        setItems(prev => prev.map(i =>
          i.id === id ? { ...i, datetime: null, dateLabel: null, deadline: null, deadlineLabel: null } : i
        ));
      }, []);

      const updateItem = useCallback((id, changes) => {
        setItems(prev => prev.map(i => i.id === id ? { ...i, ...changes } : i));
      }, []);

      const handleLogout = useCallback(async () => {
        clearStorageOnLogout();
        await sb.auth.signOut();
        // onAuthStateChange se encargará del reset del estado React.
      }, []);

      const handleReset = useCallback(async () => {
        await Promise.all([
          storageDelete(STORAGE_ITEMS), storageDelete(STORAGE_MESSAGES),
          storageDelete(STORAGE_PREFS), storageDelete(STORAGE_PROFILE),
          storageDelete(STORAGE_RESTRICTIONS), storageDelete(STORAGE_MOTOR),
          storageDelete(STORAGE_FEEDBACK), storageDelete(STORAGE_PINNED),
          storageDelete(STORAGE_OBSERVATIONS),
        ]);
        const initial = emptyMotor();
        await storageSet(STORAGE_MOTOR, initial);
        setItems([]); setMessages([]); setDark(false); setScreen("home");
        setActiveCategory("diario"); setHighlights([]); setProfile(emptyProfile());
        setRestrictions([]); setMotorState(initial); setFeedback([]);
        setPinnedIds([]); setObservations([]); setAttachedChip(null);
      }, []);

      if (!authChecked) return (
        <div style={{ height: "100%", background: "#F5F1EA", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Dots t={LIGHT} />
        </div>
      );

      if (!session) return <AuthScreen />;

      if (!apiKey) return <ApiKeyPrompt onSaved={setApiKeyOverride} />;

      if (!loaded || motorState === null) return (
        <div style={{ height: "100%", background: "#F5F1EA", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Dots t={LIGHT} />
        </div>
      );

      const hasRegistro = feedback.length > 0 || observations.length > 0;

      return (
        <div style={{ height: "100%", display: "flex", flexDirection: "column", background: t.bg, color: t.text, fontFamily: "'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif", fontSize: 15 }}>
          <style>{`
            *{box-sizing:border-box}
            input,button,textarea{font-family:inherit}
            input::placeholder,textarea::placeholder{color:${t.textFaint}}
            ::-webkit-scrollbar{width:4px;height:4px}
            ::-webkit-scrollbar-thumb{background:${t.border};border-radius:2px}
            @keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}
          `}</style>

          {/* ── NAV ── */}
          <nav style={{ flexShrink: 0, background: t.navBg, borderBottom: `1px solid ${t.navBorder}`, padding: "0 14px", zIndex: 10, position: "sticky", top: 0 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 4, height: 52 }}>
              <span style={{ fontSize: 17, fontWeight: 500, fontFamily: "Besley, Georgia, serif", fontStyle: "italic", color: t.text, marginRight: 6 }}>Veritask</span>
              <NavBtn label="Chat"   active={screen === "home"}    onClick={() => { setScreen("home"); setHighlights([]); }} t={t} />
              <NavBtn label="Listas" active={screen === "lists"}   onClick={() => setScreen("lists")} t={t} />
              {hasRegistro && (
                <NavBtn label="Registro" active={screen === "registro"} onClick={() => setScreen("registro")} t={t} />
              )}
              <div style={{ flex: 1 }} />
              <button onClick={handleReset} title="Reset demo" style={{ background: "transparent", border: `1px solid ${t.border}`, cursor: "pointer", fontSize: 12, color: t.textFaint, padding: "3px 8px", borderRadius: 12, fontFamily: "inherit" }}>
                Reset
              </button>
              <button onClick={handleLogout} title="Cerrar sesión" style={{ background: "transparent", border: `1px solid ${t.border}`, cursor: "pointer", fontSize: 12, color: t.textFaint, padding: "3px 8px", borderRadius: 12, fontFamily: "inherit", marginLeft: 6 }}>
                Salir
              </button>
              <button onClick={() => setDark(v => !v)} style={{ background: "transparent", border: "none", cursor: "pointer", fontSize: 16, color: t.textMid, padding: "0 0 0 6px" }}>
                {dark ? "☀" : "☾"}
              </button>
            </div>
          </nav>

          {/* ── CONTENT ── */}
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minHeight: 0 }}>

            {/* Barra de avisos — solo en home */}
            {screen === "home" && (
              <BarraDeAvisos
                items={items}
                pinnedIds={pinnedIds}
                t={t}
                onComplete={markDone}
                onAhoraNo={ahoraNo}
                onEnviarAlChat={(item) => { setAttachedChip(item); setScreen("home"); }}
                onDesfijar={(id) => setPinnedIds(prev => prev.filter(x => x !== id))}
                onTogglePin={togglePin}
                onRemove={remove}
              />
            )}

            {screen === "home"
              ? <HomeScreen
                  items={items} setItems={setItems}
                  messages={messages} setMessages={setMessages}
                  t={t}
                  profile={profile} setProfile={setProfile}
                  restrictions={restrictions} setRestrictions={setRestrictions}
                  motorState={motorState} setMotorState={setMotorState}
                  commitItem={commitItem} pushMessage={pushMessage}
                  highlights={highlights} setHighlights={setHighlights}
                  feedback={feedback} setFeedback={setFeedback}
                  apiKey={apiKey}
                  attachedChip={attachedChip}
                  clearChip={() => setAttachedChip(null)}
                  motorEvalRef={motorEvalRef}
                />
              : screen === "lists"
              ? <ListsScreen
                  items={items} t={t} restrictions={restrictions}
                  activeCategory={activeCategory} setActiveCategory={setActiveCategory}
                  onAdvance={advance} onRemove={remove} onMarkDone={markDone}
                  highlights={highlights}
                  pinnedIds={pinnedIds} onTogglePin={togglePin}
                  onEnviarAlChat={(item) => { setAttachedChip(item); setScreen("home"); }}
                  onAhoraNo={ahoraNo}
                  onItemSelect={(item) => { setDetailItemId(item.id); setScreen("detail"); }}
                  onUpdateItem={updateItem}
                />
              : screen === "detail"
              ? <DetailScreen
                  item={items.find(i => i.id === detailItemId)}
                  t={t}
                  pinnedIds={pinnedIds}
                  onClose={() => setScreen("lists")}
                  onMarkDone={(id) => { markDone(id); }}
                  onTogglePin={togglePin}
                  onEnviarAlChat={(item) => { setAttachedChip(item); setScreen("home"); }}
                  onRemove={(id) => { remove(id); setScreen("lists"); }}
                  onUpdateItem={updateItem}
                />
              : <RegistroScreen
                  feedback={feedback}
                  observations={observations}
                  setObservations={setObservations}
                  messages={messages}
                  t={t}
                />
            }
          </div>
        </div>
      );
    }

    // ── HOME SCREEN ───────────────────────────────────────────
    function HomeScreen({
      items, setItems, messages, setMessages, t,
      profile, setProfile, restrictions, setRestrictions,
      motorState, setMotorState, commitItem, pushMessage,
      highlights, setHighlights, feedback, setFeedback, apiKey,
      attachedChip, clearChip, motorEvalRef,
    }) {
      const [input,            setInput]            = useState("");
      const [analyzing,        setAnalyzing]        = useState(false);
      const [feedbackPanelId,  setFeedbackPanelId]  = useState(null);
      const [feedbackOtroMode, setFeedbackOtroMode] = useState(false);
      const [feedbackOtroText, setFeedbackOtroText] = useState("");
      const [pendingAskCtx,    setPendingAskCtx]    = useState(null);
      const bottomRef = useRef(null);
      const inputRef  = useRef(null);

      // Welcome message
      const welcomeInjected = useRef(false);
      useEffect(() => {
        if (messages.length === 0 && motorState?.phase === "observing" && !welcomeInjected.current) {
          welcomeInjected.current = true;
          pushMessage("assistant", WELCOME_MESSAGE);
        }
        if (messages.length > 0) welcomeInjected.current = false;
      }, [messages.length, motorState?.phase]); // eslint-disable-line

      // Motor proactive evaluation
      const evaluateMotor = useCallback(async () => {
        if (!motorState || motorEvalRef.current || !apiKey) return;

        // Cooldown fijo de 15 minutos, independiente del perfil
        const cooldownMs = 15 * 60 * 1000;
        if (motorState.lastProactiveAt) {
          const lastTs = new Date(motorState.lastProactiveAt).getTime();
          if (Date.now() - lastTs < cooldownMs) return;
        }

        // Guardia: al menos un item pendiente
        const hasPendingItems = items.some(i => i.status !== "done");
        if (!hasPendingItems) return;

        motorEvalRef.current = true;
        try {
          const result = await callMotorEvaluation(profile, items, restrictions, motorState, apiKey);
          if (result?.proactive && result.message) {
            pushMessage("assistant", stripMarkdown(result.message));
            setMotorState(prev => {
              const updated = { ...prev, lastProactiveAt: new Date().toISOString() };
              storageSet(STORAGE_MOTOR, updated);
              return updated;
            });
          }
        } catch (_) {
          // Silent fail — motor evaluation is best-effort
        } finally {
          motorEvalRef.current = false;
        }
      }, [motorState, apiKey, items, profile, restrictions]); // eslint-disable-line

      useEffect(() => {
        evaluateMotor();
      }, []); // eslint-disable-line

      useEffect(() => {
        const handleVisibility = () => {
          if (document.visibilityState === "visible") evaluateMotor();
        };
        document.addEventListener("visibilitychange", handleVisibility);
        return () => document.removeEventListener("visibilitychange", handleVisibility);
      }, [evaluateMotor]);

      useEffect(() => {
        setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: "smooth" }), 50);
      }, [messages, analyzing]);

      const saveFeedback = useCallback((msg, feedbackType, note) => {
        const msgIndex = messages.findIndex(m => m.id === msg.id);
        const userMsg  = messages.slice(0, msgIndex).reverse().find(m => m.role === "user");
        const msgTime  = Math.floor(msg.id);
        const recentItem = items.find(item => Math.abs(item.createdAt - msgTime) < 5000);
        const fb = {
          id: Date.now() + Math.random(),
          timestamp: new Date().toISOString(),
          msgId: msg.id,
          userMessage: userMsg?.text || "",
          assistantMessage: msg.text || "",
          itemCreated: recentItem ? {
            label: recentItem.label, category: recentItem.category,
            dateLabel: recentItem.dateLabel || null, deadlineLabel: recentItem.deadlineLabel || null,
          } : null,
          feedbackType, note: note || null,
        };
        setFeedback(prev => [...prev, fb]);
        setFeedbackPanelId(null); setFeedbackOtroMode(false); setFeedbackOtroText("");
      }, [messages, items, setFeedback]);

      const applyResponse = useCallback(async (resp, originalText) => {
        if (resp.profileUpdate) {
          setProfile(prev => applyProfileUpdate(prev, resp.profileUpdate));
        }
        if (resp.restrictionUpdate) {
          setRestrictions(prev => {
            const idx = prev.findIndex(r => r.label === resp.restrictionUpdate.label);
            if (idx >= 0) {
              const updated = [...prev];
              updated[idx] = { ...prev[idx], ...resp.restrictionUpdate, confirmed: true };
              return updated;
            }
            return [...prev, { ...resp.restrictionUpdate, confirmed: true }];
          });
        }
        if (resp.onboardingUpdate) {
          setMotorState(prev => {
            const updated = { ...(prev || emptyMotor()), ...resp.onboardingUpdate };
            storageSet(STORAGE_MOTOR, updated);
            return updated;
          });
        }

        switch (resp.type) {
          case "classify": {
            const recStr = typeof resp.recurrence === "string" ? resp.recurrence : null;
            commitItem(originalText, resp.label || originalText, resp.category || "diario", {
              datetime: resp.datetime || null, dateLabel: resp.dateLabel || null,
              deadline: resp.deadline || null, deadlineLabel: resp.deadlineLabel || null,
              recurrence: recStr,
            });
            const cat   = CATEGORIES[resp.category || "diario"];
            const extra = resp.dateLabel ? ` · ${resp.dateLabel}` : resp.deadlineLabel ? ` · plazo ${resp.deadlineLabel}` : recStr ? ` · ${recStr}` : "";
            const confirmText = resp.message
              ? stripMarkdown(resp.message)
              : `${cat?.icon || "·"} Anotado en ${cat?.label?.toLowerCase() || "lista"}. ${resp.label || originalText}${extra}`;
            pushMessage("assistant", confirmText);
            break;
          }
          case "multi": {
            const ts = Date.now();
            const newItems = (resp.items || []).map((item, idx) => ({
              id: ts + idx, text: originalText,
              label: item.label || originalText, category: item.category || "diario",
              status: "pending", createdAt: ts,
              datetime: item.datetime || null, dateLabel: item.dateLabel || null,
              deadline: item.deadline || null, deadlineLabel: item.deadlineLabel || null,
              recurrence: typeof item.recurrence === "string" ? item.recurrence : null,
            }));
            setItems(prev => [...newItems, ...prev]);
            pushMessage("assistant", resp.message
              ? stripMarkdown(resp.message)
              : `Anotado: ${newItems.map(i => i.label).join(", ")}.`
            );
            break;
          }
          case "ask": {
            if (!resp.options || resp.options.length === 0) {
              if (resp.message) pushMessage("assistant", stripMarkdown(resp.message));
              break;
            }
            setMessages(prev => [...prev, {
              id: Date.now() + Math.random(), role: "ask",
              question: resp.question || "¿Cómo lo clasifico?",
              options: resp.options || [],
              pendingItem: resp.pendingItem || null,
              selectedIdx: null,
            }]);
            break;
          }
          case "action": {
            if (resp.do === "create_item" && resp.item) {
              commitItem(
                resp.item.label || originalText, resp.item.label || originalText,
                resp.item.category || "diario", {
                  datetime: resp.item.datetime || null, dateLabel: resp.item.dateLabel || null,
                  deadline: resp.item.deadline || null, deadlineLabel: resp.item.deadlineLabel || null,
                }
              );
            } else if (resp.do === "update_item" && resp.itemId) {
              setItems(prev => prev.map(i => String(i.id) === String(resp.itemId) ? { ...i, ...(resp.changes || {}) } : i));
            } else if (resp.do === "update_items" && Array.isArray(resp.itemIds)) {
              setItems(prev => prev.map(i => resp.itemIds.map(String).includes(String(i.id)) ? { ...i, ...(resp.changes || {}) } : i));
            }
            if (resp.message) pushMessage("assistant", stripMarkdown(resp.message));
            break;
          }
          case "query": {
            if (resp.message) pushMessage("assistant", stripMarkdown(resp.message));
            if (resp.highlights?.length) setHighlights(resp.highlights);
            break;
          }
          default: {
            if (resp.message) pushMessage("assistant", stripMarkdown(resp.message));
            break;
          }
        }

        // Discovery question — se renderiza después de la respuesta principal
        if (resp.discoveryQuestion?.question) {
          const dq = resp.discoveryQuestion;
          setMessages(prev => [...prev, {
            id: Date.now() + Math.random(), role: "ask",
            question: dq.question,
            options: Array.isArray(dq.options) ? dq.options : [],
            pendingItem: null,
            selectedIdx: null,
          }]);
        }
      }, [commitItem, pushMessage, setMessages, setProfile, setRestrictions, setMotorState, setHighlights, setItems]);

      const handleOptionSelect = useCallback(async (askMsgId, idx) => {
        const askMsg = messages.find(m => m.id === askMsgId && m.role === "ask");
        if (!askMsg || askMsg.selectedIdx !== null || analyzing) return;
        setMessages(prev => prev.map(m => m.id === askMsgId ? { ...m, selectedIdx: idx } : m));
        const selectedOption = askMsg.options[idx];
        if (selectedOption === "Otro") {
          setPendingAskCtx({ pendingItem: askMsg.pendingItem });
          inputRef.current?.focus();
          return;
        }
        setAnalyzing(true);
        try {
          const resp = await processInput(selectedOption, items, profile, restrictions, motorState, apiKey, askMsg.pendingItem, messages);
          await applyResponse(resp, selectedOption);
        } catch (_) {
          pushMessage("assistant", "Anotado.");
        }
        setAnalyzing(false);
        inputRef.current?.focus();
      }, [messages, setMessages, analyzing, items, profile, restrictions, motorState, apiKey, applyResponse, pushMessage]);

      const handleSend = useCallback(async () => {
        const text = input.trim();
        if (!text || analyzing) return;
        setHighlights([]);
        const chip = attachedChip;
        const askCtx = pendingAskCtx;
        setPendingAskCtx(null);
        clearChip();
        setInput("");

        const msgId = Date.now() + Math.random();
        setMessages(prev => [...prev, { id: msgId, role: "user", text, chip: chip || null, createdAt: new Date().toISOString() }]);

        setAnalyzing(true);
        try {
          const apiText = chip ? `[Contexto: item "${chip.label}"] ${text}` : text;
          const resp = await processInput(apiText, items, profile, restrictions, motorState, apiKey, askCtx?.pendingItem ?? null, messages);
          await applyResponse(resp, text);
        } catch (e) {
          const errMsg = e?.message || "";
          if (/credit|billing|balance|quota/i.test(errMsg)) {
            pushMessage("assistant", "Sin créditos disponibles. Recarga en console.anthropic.com");
          } else {
            commitItem(text, text, "diario");
            pushMessage("assistant", "Anotado.");
          }
        }
        setAnalyzing(false);
        inputRef.current?.focus();
      }, [input, analyzing, attachedChip, clearChip, pendingAskCtx, items, profile, restrictions, motorState, apiKey, applyResponse, commitItem, pushMessage, setHighlights, messages]);

      const pending = items.filter(i => i.status === "pending").length;

      return (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }}>

          {/* Messages */}
          <div style={{ flex: 1, overflowY: "auto", padding: "16px 16px 8px" }}>

            {messages.length === 0 && (
              <div style={{ textAlign: "center", padding: "52px 16px" }}>
                <p style={{ fontSize: 20, fontWeight: 700, color: t.text, margin: "0 0 8px", letterSpacing: "-0.3px" }}>Solo tienes que escribir.</p>
                <p style={{ fontSize: 14, color: t.textFaint, margin: 0, lineHeight: 1.6 }}>Nunca organizar. Veritask se encarga del resto.</p>
                {pending > 0 && <p style={{ fontSize: 12, color: t.textFaint, marginTop: 16 }}>{pending} {pending === 1 ? "cosa pendiente" : "cosas pendientes"}</p>}
              </div>
            )}

            {messages.map((msg, i) => {
              // ── ask ──
              if (msg.role === "ask") {
                return (
                  <div key={msg.id} style={{ marginTop: 16, display: "flex", justifyContent: "flex-start" }}>
                    <div style={{ maxWidth: "88%", padding: "12px 14px", borderRadius: "18px 18px 18px 4px", background: t.msgBot, border: `1px solid ${t.msgBotBorder}` }}>
                      <p style={{ margin: "0 0 10px", fontSize: 14, color: t.msgBotText, lineHeight: 1.5 }}>— {msg.question}</p>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        {msg.options.map((opt, idx) => {
                          const isSelected  = msg.selectedIdx === idx;
                          const hasSelected = msg.selectedIdx !== null;
                          return (
                            <button
                              key={idx}
                              onClick={() => handleOptionSelect(msg.id, idx)}
                              disabled={hasSelected || analyzing}
                              style={{
                                padding: "5px 12px", fontSize: 12, fontWeight: 500,
                                background: isSelected ? t.accent : "transparent",
                                color: isSelected ? "#FFF" : hasSelected ? t.textFaint : t.accent,
                                border: `1.5px solid ${isSelected ? t.accent : hasSelected ? t.border : t.accent}`,
                                borderRadius: 20, cursor: hasSelected || analyzing ? "default" : "pointer",
                                fontFamily: "inherit", opacity: hasSelected && !isSelected ? 0.35 : 1, transition: "all 0.15s",
                              }}
                            >
                              {opt}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              }

              // ── user / assistant ──
              const prev     = i > 0 ? messages[i - 1] : null;
              const prevRole = prev?.role;
              const gap      = prev && prevRole !== "separator" && prevRole !== "ask" && prevRole !== msg.role;
              const isUser   = msg.role === "user";
              const hasFeedback = !isUser && feedback.some(f => f.msgId === msg.id);
              const panelOpen   = !isUser && feedbackPanelId === msg.id;

              return (
                <div key={msg.id} style={{ marginTop: gap ? 16 : 4, display: "flex", flexDirection: "column", alignItems: isUser ? "flex-end" : "flex-start" }}>
                  <div style={{ position: "relative", maxWidth: "82%" }}>
                    <div style={{
                      padding: "10px 14px",
                      paddingBottom: !isUser ? 22 : 10,
                      borderRadius: isUser ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
                      background: isUser ? t.msgUser : t.msgBot,
                      color: isUser ? t.msgUserText : t.msgBotText,
                      border: `1px solid ${isUser ? t.msgUserBorder : t.msgBotBorder}`,
                      fontFamily: isUser ? "inherit" : "'Besley', Georgia, serif",
                      fontSize: 14, lineHeight: 1.5, whiteSpace: "pre-wrap",
                    }}>
                      {isUser && msg.chip && (
                        <div style={{ fontSize: 11, fontWeight: 600, color: t.accent, background: `${t.accent}18`, borderRadius: 6, padding: "2px 8px", marginBottom: 6, display: "inline-flex", alignItems: "center", gap: 4 }}>
                          ◉ {msg.chip.label}
                        </div>
                      )}
                      {msg.text}
                    </div>
                    {!isUser && (
                      <button
                        onClick={() => {
                          if (feedbackPanelId === msg.id) {
                            setFeedbackPanelId(null); setFeedbackOtroMode(false); setFeedbackOtroText("");
                          } else {
                            setFeedbackPanelId(msg.id); setFeedbackOtroMode(false); setFeedbackOtroText("");
                          }
                        }}
                        title="Dar feedback"
                        style={{ position: "absolute", bottom: 5, right: 8, background: "transparent", border: "none", cursor: "pointer", fontSize: 11, color: hasFeedback ? t.accent : t.textFaint, padding: "2px 3px", lineHeight: 1, opacity: hasFeedback ? 1 : 0.6 }}
                      >
                        {hasFeedback ? "●" : "···"}
                      </button>
                    )}
                  </div>

                  {panelOpen && (
                    <div style={{ maxWidth: "82%", marginTop: 4, background: t.bgCard, border: `1.5px solid ${t.border}`, borderRadius: 10, padding: "10px 12px" }}>
                      {!feedbackOtroMode ? (
                        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                          {[
                            { type: "good_response",         label: "✓ Buena respuesta" },
                            { type: "should_have_asked",     label: "Debería haber preguntado" },
                            { type: "wrong_classification",  label: "Clasificación incorrecta" },
                            { type: "should_not_have_noted", label: "No debería haberlo anotado" },
                            { type: "other",                 label: "Otro" },
                          ].map(({ type, label }) => (
                            <button
                              key={type}
                              onClick={() => { if (type === "other") setFeedbackOtroMode(true); else saveFeedback(msg, type, null); }}
                              style={{ padding: "6px 12px", fontSize: 12, background: "transparent", border: `1px solid ${t.border}`, borderRadius: 16, color: t.textMid, cursor: "pointer", fontFamily: "inherit" }}
                            >
                              {label}
                            </button>
                          ))}
                        </div>
                      ) : (
                        <div>
                          <textarea
                            value={feedbackOtroText}
                            onChange={e => setFeedbackOtroText(e.target.value)}
                            placeholder="Describe qué ocurrió..." autoComplete="off" name="feedback-text"
                            autoFocus
                            style={{ width: "100%", padding: "8px 10px", fontSize: 13, background: t.bgInput, border: `1px solid ${t.border}`, borderRadius: 8, color: t.text, resize: "none", height: 72, fontFamily: "inherit", outline: "none" }}
                          />
                          <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
                            <button onClick={() => saveFeedback(msg, "other", feedbackOtroText.trim() || null)} style={{ padding: "6px 16px", fontSize: 13, fontWeight: 600, background: t.accent, border: "none", borderRadius: 16, color: "#FFF", cursor: "pointer", fontFamily: "inherit" }}>Guardar</button>
                            <button onClick={() => { setFeedbackOtroMode(false); setFeedbackOtroText(""); }} style={{ padding: "6px 12px", fontSize: 13, background: "transparent", border: `1px solid ${t.border}`, borderRadius: 16, color: t.textFaint, cursor: "pointer", fontFamily: "inherit" }}>Cancelar</button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}

            {analyzing && (
              <div style={{ marginTop: 4, display: "flex", justifyContent: "flex-start" }}>
                <div style={{ padding: "12px 16px", borderRadius: "18px 18px 18px 4px", background: t.msgBot, border: `1px solid ${t.msgBotBorder}` }}>
                  <Dots t={t} />
                </div>
              </div>
            )}

            <div ref={bottomRef} />
          </div>

          {/* Composer */}
          <div style={{ flexShrink: 0, borderTop: `1px solid ${t.navBorder}`, background: t.navBg }}>
            {attachedChip && (
              <div style={{ padding: "8px 16px 0", display: "flex" }}>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 6, background: `${t.accent}18`, border: `1px solid ${t.accent}40`, borderRadius: 20, padding: "5px 10px 5px 12px" }}>
                  <span style={{ fontSize: 12, fontWeight: 600, color: t.accent }}>◉ {attachedChip.label}</span>
                  <button onClick={clearChip} style={{ background: "transparent", border: "none", cursor: "pointer", color: t.textFaint, fontSize: 15, lineHeight: 1, padding: "0 0 0 4px" }}>×</button>
                </div>
              </div>
            )}
            <div style={{ padding: "10px 14px 20px", display: "flex", gap: 10, alignItems: "center" }}>
              <input
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && !e.shiftKey && handleSend()}
                type="text" inputMode="text" enterKeyHint="send" placeholder="cuéntame..." autoComplete="off" autoCorrect="off" autoCapitalize="sentences" name="chat-input" id="chat-input"
                autoFocus
                style={{ flex: 1, padding: "12px 16px", fontSize: 15, background: t.bgInput, border: `1.5px solid ${t.border}`, borderRadius: 24, color: t.text, outline: "none" }}
              />
              <button
                onClick={handleSend}
                disabled={analyzing || !input.trim()}
                style={{ width: 44, height: 44, borderRadius: "50%", border: "none", cursor: "pointer", flexShrink: 0, background: input.trim() && !analyzing ? t.accent : t.border, color: "#FFF", fontSize: 20, display: "flex", alignItems: "center", justifyContent: "center", transition: "background 0.15s" }}
              >
                ↑
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── REGISTRO SCREEN ───────────────────────────────────────
    const FEEDBACK_LABELS = {
      good_response:         "✓ Buena respuesta",
      should_have_asked:     "Debería haber preguntado",
      wrong_classification:  "Clasificación incorrecta",
      should_not_have_noted: "No debería haberlo anotado",
      other:                 "Otro",
    };

    function RegistroScreen({ feedback, observations, setObservations, messages, t }) {
      const [showNewObs, setShowNewObs] = useState(false);
      const [obsText,    setObsText]    = useState("");
      const [copied,     setCopied]     = useState(false);
      const [exportText, setExportText] = useState("");

      const formatTs = (iso) => {
        const d = new Date(iso);
        const today = new Date();
        const isToday = d.toDateString() === today.toDateString();
        const time = d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
        if (isToday) return `hoy ${time}`;
        return `${d.toLocaleDateString("es-ES", { day: "numeric", month: "short" })} ${time}`;
      };

      // Merge and sort newest first
      const allEntries = [
        ...feedback.map(fb  => ({ ...fb,  _kind: "feedback" })),
        ...observations.map(obs => ({ ...obs, _kind: "observation" })),
      ].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      const saveObs = () => {
        const text = obsText.trim();
        if (!text) return;
        setObservations(prev => [...prev, { id: Date.now() + Math.random(), timestamp: new Date().toISOString(), text }]);
        setObsText(""); setShowNewObs(false);
      };

      const buildExportText = () => {
        const entries = [];

        // Mensajes de conversación
        messages.forEach(msg => {
          if (msg.role === "user" || msg.role === "assistant") {
            entries.push({
              ts: msg.createdAt || new Date().toISOString(),
              text: `[${msg.role === "user" ? "Tú" : "Veritask"}] ${msg.text}`
            });
          }
        });

        // Entradas de feedback
        feedback.forEach(fb => {
          const label = FEEDBACK_LABELS[fb.feedbackType] || fb.feedbackType;
          let text = `[Feedback] ${label}`;
          if (fb.note) text += ` — "${fb.note}"`;
          if (fb.itemCreated) {
            const ip = [fb.itemCreated.label, fb.itemCreated.category];
            if (fb.itemCreated.dateLabel) ip.push(fb.itemCreated.dateLabel);
            text += `\n  Anotó: ${ip.join(" · ")}`;
          }
          entries.push({ ts: fb.timestamp, text });
        });

        // Observaciones libres
        observations.forEach(obs => {
          entries.push({ ts: obs.timestamp, text: `[Observación] ${obs.text}` });
        });

        // Ordenar cronológicamente
        entries.sort((a, b) => new Date(a.ts) - new Date(b.ts));

        return entries.map(e => {
          const d = new Date(e.ts);
          const fecha = d.toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
          const hora = d.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
          return `[${fecha} ${hora}] ${e.text}`;
        }).join("\n");
      };

      const handleCopy = async () => {
        const text = buildExportText();
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true); setTimeout(() => setCopied(false), 2000);
        } catch {
          setExportText(text);
        }
      };

      const handleDownload = () => {
        const text = buildExportText();
        const blob = new Blob(["﻿" + text], { type: "text/plain;charset=utf-8" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href = url; a.download = `veritask-registro-${new Date().toISOString().split("T")[0]}.txt`;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      };

      return (
        <div style={{ flex: 1, overflowY: "auto" }}>
          <div style={{ padding: "20px 16px", maxWidth: 540, margin: "0 auto" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
              <span style={{ fontSize: 13, color: t.textFaint }}>{allEntries.length} {allEntries.length === 1 ? "entrada" : "entradas"}</span>
              <button
                onClick={() => setShowNewObs(true)}
                style={{ padding: "7px 14px", fontSize: 13, fontWeight: 600, background: "transparent", border: `1.5px solid ${t.accent}`, borderRadius: 20, color: t.accent, cursor: "pointer", fontFamily: "inherit" }}
              >
                + Nueva observación
              </button>
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
              {allEntries.length === 0 && (
                <p style={{ color: t.textFaint, fontSize: 14, textAlign: "center", padding: "32px 0", fontStyle: "italic" }}>sin entradas aún</p>
              )}
              {allEntries.map(entry => (
                <div key={entry.id} style={{ background: t.bgCard, border: `1.5px solid ${t.border}`, borderRadius: 10, padding: "12px 14px", position: "relative" }}>
                  {entry._kind === "observation" && (
                    <span style={{ position: "absolute", top: 8, right: 10, fontSize: 10, color: t.accent, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.04em" }}>observación libre</span>
                  )}
                  <p style={{ fontSize: 11, color: t.textFaint, marginBottom: 8 }}>{formatTs(entry.timestamp)}</p>
                  {entry._kind === "feedback" ? (
                    <>
                      <p style={{ fontSize: 13, color: t.textMid, marginBottom: 4, lineHeight: 1.4 }}>
                        Tú escribiste: <span style={{ color: t.text }}>"{entry.userMessage}"</span>
                      </p>
                      <p style={{ fontSize: 13, color: t.textMid, marginBottom: 4, lineHeight: 1.4 }}>
                        La app respondió: <span style={{ color: t.text }}>"{entry.assistantMessage}"</span>
                      </p>
                      {entry.itemCreated && (
                        <p style={{ fontSize: 13, color: t.textMid, marginBottom: 4, lineHeight: 1.4 }}>
                          Anotó: <span style={{ color: t.text }}>{entry.itemCreated.label}</span>
                          <span style={{ color: t.textFaint }}> · {entry.itemCreated.category}{entry.itemCreated.dateLabel ? ` · ${entry.itemCreated.dateLabel}` : entry.itemCreated.deadlineLabel ? ` · ${entry.itemCreated.deadlineLabel}` : ""}</span>
                        </p>
                      )}
                      <p style={{ fontSize: 13, color: t.accent, marginTop: 6, fontWeight: 600 }}>
                        {FEEDBACK_LABELS[entry.feedbackType] || entry.feedbackType}
                        {entry.note && <span style={{ color: t.textMid, fontWeight: 400 }}> — "{entry.note}"</span>}
                      </p>
                    </>
                  ) : (
                    <p style={{ fontSize: 14, color: t.text, lineHeight: 1.5, paddingRight: 90 }}>{entry.text}</p>
                  )}
                </div>
              ))}
            </div>

            {exportText ? (
              <div>
                <textarea
                  readOnly value={exportText}
                  onClick={e => e.target.select()}
                  style={{ width: "100%", height: 180, padding: "10px 12px", fontSize: 12, background: t.bgInput, border: `1.5px solid ${t.border}`, borderRadius: 8, color: t.text, fontFamily: "monospace", resize: "vertical", outline: "none" }}
                />
                <p style={{ fontSize: 12, color: t.textFaint, marginTop: 6 }}>Toca el texto para seleccionarlo todo.</p>
              </div>
            ) : (
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                <button onClick={handleCopy} style={{ padding: "10px 20px", fontSize: 14, fontWeight: 600, background: copied ? t.accent : "transparent", border: `1.5px solid ${t.accent}`, borderRadius: 20, color: copied ? "#FFF" : t.accent, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s" }}>
                  {copied ? "Copiado ✓" : "Copiar"}
                </button>
                <button onClick={handleDownload} style={{ padding: "10px 20px", fontSize: 14, fontWeight: 600, background: t.accent, border: `1.5px solid ${t.accent}`, borderRadius: 20, color: "#FFF", cursor: "pointer", fontFamily: "inherit" }}>
                  Descargar .txt
                </button>
              </div>
            )}
          </div>

          {/* Nueva observación — modal desde abajo */}
          {showNewObs && (
            <>
              <div onClick={() => { setShowNewObs(false); setObsText(""); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.38)", zIndex: 200 }} />
              <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 201, background: t.bgCard, borderRadius: "18px 18px 0 0", padding: "20px 20px 32px", boxShadow: "0 -4px 24px rgba(0,0,0,0.14)" }}>
                <p style={{ fontSize: 15, fontWeight: 600, color: t.text, marginBottom: 12 }}>Nueva observación</p>
                <textarea
                  value={obsText}
                  onChange={e => setObsText(e.target.value)}
                  placeholder="Escribe lo que observaste..."
                  autoFocus
                  style={{ width: "100%", padding: "10px 12px", fontSize: 14, background: t.bgInput, border: `1.5px solid ${t.border}`, borderRadius: 10, color: t.text, resize: "none", height: 100, fontFamily: "inherit", outline: "none" }}
                />
                <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                  <button onClick={saveObs} style={{ padding: "10px 20px", fontSize: 14, fontWeight: 600, background: t.accent, border: "none", borderRadius: 20, color: "#FFF", cursor: "pointer", fontFamily: "inherit" }}>Guardar</button>
                  <button onClick={() => { setShowNewObs(false); setObsText(""); }} style={{ padding: "10px 16px", fontSize: 14, background: "transparent", border: `1px solid ${t.border}`, borderRadius: 20, color: t.textFaint, cursor: "pointer", fontFamily: "inherit" }}>Cancelar</button>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ── LISTS SCREEN ──────────────────────────────────────────
    const DAYS_ES = { monday: "lunes", tuesday: "martes", wednesday: "miércoles", thursday: "jueves", friday: "viernes", saturday: "sábado", sunday: "domingo" };

    function DetailScreen({ item, t, pinnedIds, onClose, onMarkDone, onTogglePin, onEnviarAlChat, onRemove, onUpdateItem }) {
      const [editingLabel, setEditingLabel] = React.useState(false);
      const [labelText, setLabelText] = React.useState(item?.label || "");
      const [notes, setNotes] = React.useState(item?.notes || "");

      if (!item) return null;

      const isPinned = pinnedIds.includes(item.id);
      const isDone = item.status === "done";
      const cat = CATEGORIES[item.category] || CATEGORIES.diario;

      const saveLabel = () => {
        if (labelText.trim() && labelText.trim() !== item.label) {
          onUpdateItem(item.id, { label: labelText.trim() });
        }
        setEditingLabel(false);
      };

      const saveNotes = (val) => {
        setNotes(val);
        onUpdateItem(item.id, { notes: val });
      };

      return (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", minHeight: 0 }}>
          {/* Header */}
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 16px", borderBottom: `1px solid ${t.border}`, flexShrink: 0 }}>
            <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: t.textMid, fontSize: 22, padding: 4 }}>←</button>
            <span style={{ fontSize: 13, fontWeight: 600, letterSpacing: 1, color: t.textFaint, textTransform: "uppercase" }}>Detalle</span>
            <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: t.accent, fontSize: 15, fontWeight: 600, padding: 4 }}>Listo</button>
          </div>

          {/* Content */}
          <div style={{ flex: 1, overflowY: "auto", padding: "20px 16px" }}>

            {/* Category + pinned */}
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
              <span style={{ fontSize: 13, color: t.textFaint }}>{cat.icon} {cat.label.toUpperCase()}</span>
              {isPinned && <span style={{ fontSize: 12, color: t.textFaint, background: t.bgCard, borderRadius: 8, padding: "2px 8px", border: `1px solid ${t.border}` }}>fijado</span>}
              {isDone && <span style={{ fontSize: 12, color: "#FFF", background: "#4CAF50", borderRadius: 8, padding: "2px 8px" }}>COMPLETADA</span>}
            </div>

            {/* Title */}
            {editingLabel
              ? <textarea
                  autoFocus
                  value={labelText}
                  onChange={e => setLabelText(e.target.value)}
                  onBlur={saveLabel}
                  style={{ width: "100%", fontSize: 24, fontFamily: "Besley, Georgia, serif", fontWeight: 500, color: t.text, background: t.bgCard, border: `1.5px solid ${t.accent}`, borderRadius: 10, padding: 10, resize: "none", minHeight: 80, outline: "none" }}
                />
              : <div onClick={() => { setEditingLabel(true); setLabelText(item.label); }} style={{ fontSize: 24, fontFamily: "Besley, Georgia, serif", fontWeight: 500, color: isDone ? t.textFaint : t.text, textDecoration: isDone ? "line-through" : "none", marginBottom: 6, cursor: "text", lineHeight: 1.3 }}>
                  {item.label}
                </div>
            }
            {!editingLabel && <div style={{ fontSize: 12, color: t.textFaint, marginBottom: 20 }}>tocar para editar</div>}

            {/* Acciones primarias */}
            <div style={{ display: "flex", gap: 10, marginBottom: 24 }}>
              <button onClick={() => onMarkDone(item.id)} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1.5px solid ${t.border}`, background: isDone ? t.accent : t.bgCard, color: isDone ? "#FFF" : t.text, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
                ✓ {isDone ? "Hecha" : "Marcar hecha"}
              </button>
              <button onClick={() => onTogglePin(item.id)} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1.5px solid ${t.border}`, background: isPinned ? "#FFF3E0" : t.bgCard, color: isPinned ? "#E65100" : t.text, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
                📌 {isPinned ? "Fijada" : "Fijar"}
              </button>
            </div>

            {/* Cuándo */}
            <div style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, color: t.textFaint, textTransform: "uppercase", marginBottom: 8 }}>Cuándo</div>
              {item.dateLabel || item.deadlineLabel
                ? <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: t.bgCard, borderRadius: 12, padding: "12px 14px", border: `1px solid ${t.border}` }}>
                    <div>
                      <div style={{ fontSize: 15, fontWeight: 500, color: t.text }}>🕐 {item.dateLabel || item.deadlineLabel}</div>
                      {item.datetime && <div style={{ fontSize: 12, color: t.textFaint, marginTop: 2 }}>{new Date(item.datetime).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}</div>}
                    </div>
                    <button onClick={() => onEnviarAlChat(item)} style={{ fontSize: 13, color: t.accent, fontWeight: 600, background: "none", border: "none", cursor: "pointer" }}>Enviar al chat</button>
                  </div>
                : <div onClick={() => onEnviarAlChat(item)} style={{ display: "flex", alignItems: "center", gap: 8, background: t.bgCard, borderRadius: 12, padding: "12px 14px", border: `1.5px dashed ${t.border}`, cursor: "pointer", color: t.textFaint }}>
                    <span>+</span><span style={{ fontSize: 14 }}>Añadir fecha o plazo</span>
                  </div>
              }
            </div>

            {/* Notas */}
            <div style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: 1, color: t.textFaint, textTransform: "uppercase", marginBottom: 8 }}>Notas</div>
              <textarea
                value={notes}
                onChange={e => saveNotes(e.target.value)}
                placeholder="Añade una nota..."
                autoComplete="off"
                style={{ width: "100%", minHeight: 100, background: t.bgCard, border: `1px solid ${t.border}`, borderRadius: 12, padding: "12px 14px", fontSize: 15, fontFamily: "Besley, Georgia, serif", color: t.text, resize: "none", outline: "none" }}
              />
            </div>

            {/* Eliminar */}
            <button onClick={() => { if (window.confirm("¿Eliminar este item?")) onRemove(item.id); }} style={{ width: "100%", padding: "14px 0", background: "none", border: "none", color: "#D32F2F", fontSize: 15, fontWeight: 600, cursor: "pointer", textAlign: "center" }}>
              Eliminar item
            </button>

          </div>
        </div>
      );
    }

    function ListsScreen({ items, t, restrictions, activeCategory, setActiveCategory, onAdvance, onRemove, onMarkDone, highlights, pinnedIds, onTogglePin, onEnviarAlChat, onAhoraNo, onItemSelect }) {
      const [contextMenu, setContextMenu] = useState(null); // { item }

      const isHorarios = activeCategory === "horarios";
      const active = isHorarios ? [] : items.filter(i => i.category === activeCategory && i.status !== "done");
      const done   = isHorarios ? [] : items.filter(i => i.category === activeCategory && i.status === "done");

      return (
        <div style={{ flex: 1, overflowY: "auto" }}>
          <div style={{ padding: "20px 16px", maxWidth: 540, margin: "0 auto" }}>
            {/* Tabs */}
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 20 }}>
              {Object.entries(CATEGORIES).map(([key, { label, icon }]) => {
                const count = items.filter(i => i.category === key && i.status !== "done").length;
                const on = activeCategory === key;
                return (
                  <button key={key} onClick={() => setActiveCategory(key)} style={{ padding: "7px 14px", borderRadius: 20, border: `1.5px solid ${on ? t.accent : t.border}`, background: on ? t.accent : "transparent", color: on ? "#FFF" : t.textMid, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 5 }}>
                    <span style={{ fontSize: 11 }}>{icon}</span>{label}
                    {count > 0 && <span style={{ background: on ? "rgba(255,255,255,0.3)" : t.accent, color: "#FFF", borderRadius: 10, padding: "1px 6px", fontSize: 10, fontWeight: 700 }}>{count}</span>}
                  </button>
                );
              })}
              <button onClick={() => setActiveCategory("horarios")} style={{ padding: "7px 14px", borderRadius: 20, border: `1.5px solid ${activeCategory === "horarios" ? t.accent : t.border}`, background: activeCategory === "horarios" ? t.accent : "transparent", color: activeCategory === "horarios" ? "#FFF" : t.textMid, fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ fontSize: 11 }}>◈</span>Horarios
                {restrictions?.length > 0 && <span style={{ background: activeCategory === "horarios" ? "rgba(255,255,255,0.3)" : t.accent, color: "#FFF", borderRadius: 10, padding: "1px 6px", fontSize: 10, fontWeight: 700 }}>{restrictions.length}</span>}
              </button>
            </div>

            {/* Horarios view */}
            {isHorarios ? (
              <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                {(!restrictions || restrictions.length === 0) && (
                  <p style={{ color: t.textFaint, fontSize: 14, textAlign: "center", padding: "32px 0", fontStyle: "italic" }}>sin horarios registrados</p>
                )}
                {(restrictions || []).map((r, idx) => (
                  <div key={idx} style={{ display: "flex", alignItems: "flex-start", gap: 12, padding: "11px 14px", background: t.bgCard, borderRadius: 8, border: `1.5px solid ${t.border}`, marginBottom: 2 }}>
                    <span style={{ fontSize: 16, marginTop: 1, flexShrink: 0, color: t.accent }}>◈</span>
                    <div style={{ flex: 1 }}>
                      <span style={{ fontSize: 14, fontWeight: 500, color: t.text, lineHeight: 1.4 }}>{r.label}</span>
                      <div style={{ fontSize: 12, color: t.textFaint, marginTop: 3 }}>
                        {r.days?.map(d => DAYS_ES[d] || d).join(", ")}
                        {r.startTime && r.endTime && ` · ${r.startTime}–${r.endTime}`}
                        {!r.confirmed && <span style={{ marginLeft: 6, fontStyle: "italic" }}>inferido</span>}
                      </div>
                    </div>
                  </div>
                ))}
                <p style={{ fontSize: 12, color: t.textFaint, marginTop: 16, textAlign: "center" }}>Para eliminar un horario, dímelo por el chat.</p>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
                {active.length === 0 && done.length === 0 && (
                  <p style={{ color: t.textFaint, fontSize: 14, textAlign: "center", padding: "32px 0", fontStyle: "italic" }}>vacío</p>
                )}
                {active.map(item => (
                  <ItemRow
                    key={item.id} item={item} t={t}
                    onAdvance={onAdvance} onRemove={onRemove}
                    highlighted={highlights.some(h => normalize(h) === normalize(item.label))}
                    isPinned={pinnedIds.includes(item.id)}
                    onLongPress={(pos) => setContextMenu({ item, pos })}
                    onSelect={() => onItemSelect(item)}
                  />
                ))}
                {done.length > 0 && (
                  <div style={{ marginTop: 24 }}>
                    <p style={{ fontSize: 12, color: t.textFaint, marginBottom: 8 }}>completadas · {done.length}</p>
                    {done.map(item => (
                      <ItemRow
                        key={item.id} item={item} t={t}
                        onAdvance={onAdvance} onRemove={onRemove}
                        highlighted={false} isPinned={false}
                        onLongPress={(pos) => setContextMenu({ item, pos })}
                        onSelect={() => onItemSelect(item)}
                      />
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Context menu */}
          {contextMenu && (
            <ContextMenu
              item={contextMenu.item}
              t={t}
              pos={contextMenu.pos}
              onClose={() => setContextMenu(null)}
              options={[
                { label: "Completada", action: () => onMarkDone(contextMenu.item.id) },
                {
                  label: pinnedIds.includes(contextMenu.item.id) ? "Desfijar tarea" : "Fijar tarea",
                  action: () => onTogglePin(contextMenu.item.id),
                },
                { label: "Enviar al chat", action: () => onEnviarAlChat(contextMenu.item) },
                { label: "Ahora no", action: () => onAhoraNo(contextMenu.item.id) },
                { label: "Eliminar", danger: true, action: () => onRemove(contextMenu.item.id) },
              ]}
            />
          )}
        </div>
      );
    }

    // ── ITEM ROW ──────────────────────────────────────────────
    function ItemRow({ item, t, onAdvance, onRemove, highlighted, isPinned, onLongPress, onSelect }) {
      const lp   = useLongPress(onLongPress);
      const done   = item.status === "done";
      const active = item.status === "doing";
      const days   = getDaysUntil(item.datetime || item.deadline);
      const urgent = days !== null && days >= 0 && days <= 1 && !done;

      return (
        <div
          {...lp}
          onClick={onSelect}
          style={{
            display: "flex", alignItems: "center", gap: 12, padding: "11px 14px",
            background: isPinned ? `${t.pinned}28` : highlighted ? `${t.accent}15` : t.bgCard,
            borderRadius: 8,
            border: `1.5px solid ${isPinned ? t.pinned : highlighted ? t.accent : urgent ? "#F0C060" : active ? `${t.accent}66` : t.border}`,
            marginBottom: 2, transition: "all 0.15s", userSelect: "none", cursor: "pointer",
          }}
        >
          <button
            onMouseDown={e => e.stopPropagation()}
            onTouchStart={e => e.stopPropagation()}
            onClick={e => { e.stopPropagation(); onAdvance(item.id); }}
            style={{ width: 26, height: 26, borderRadius: "50%", border: "none", cursor: "pointer", fontSize: 12, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, background: done ? t.accent : active ? `${t.accent}33` : t.bgInput, color: done ? "#FFF" : active ? t.accent : t.textFaint, transition: "all 0.15s" }}
          >
            {done ? "✓" : active ? "→" : "○"}
          </button>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 14, fontWeight: 500, color: done ? t.textFaint : t.text, textDecoration: done ? "line-through" : "none", lineHeight: 1.4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {item.label || item.text}
            </div>
            {(item.dateLabel || item.deadlineLabel || item.recurrence) && !done && (
              <div style={{ fontSize: 12, color: urgent ? "#F0A020" : t.textFaint, marginTop: 2 }}>
                {item.dateLabel || item.deadlineLabel || item.recurrence}
              </div>
            )}
          </div>
          {isPinned && !done && <span style={{ fontSize: 13, color: t.pinned, flexShrink: 0 }}>📌</span>}
          {active && !done && <span style={{ fontSize: 11, padding: "2px 8px", background: `${t.accent}22`, color: t.accent, borderRadius: 10, fontWeight: 600, flexShrink: 0 }}>en curso</span>}
          {urgent && !done && <span style={{ fontSize: 11, padding: "2px 8px", background: "#F0C06022", color: "#A07000", borderRadius: 10, flexShrink: 0 }}>⏰</span>}
          <button
            onMouseDown={e => e.stopPropagation()}
            onTouchStart={e => e.stopPropagation()}
            onClick={e => { e.stopPropagation(); onRemove(item.id); }}
            style={{ background: "transparent", border: "none", color: t.textFaint, fontSize: 18, cursor: "pointer", padding: "0 2px", lineHeight: 1, flexShrink: 0 }}
          >
            ×
          </button>
        </div>
      );
    }

    // ── NAV BTN ───────────────────────────────────────────────
    function NavBtn({ label, active, onClick, t }) {
      return (
        <button
          onClick={onClick}
          style={{ padding: "5px 10px", borderRadius: 0, border: "none", borderBottom: active ? `2px solid ${t.accent}` : "2px solid transparent", cursor: "pointer", fontSize: 13, fontWeight: 600, background: "transparent", color: active ? t.text : t.textMid, fontFamily: "inherit", transition: "color 0.15s" }}
        >
          {label}
        </button>
      );
    }

    // ── DOTS ──────────────────────────────────────────────────
    function Dots({ t }) {
      return (
        <span style={{ display: "inline-flex", gap: 4 }}>
          {[0, 0.2, 0.4].map((d, i) => (
            <span key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: t.textFaint, display: "inline-block", animation: `blink 1.2s ${d}s infinite` }} />
          ))}
        </span>
      );
    }

    // ── RENDER ────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
