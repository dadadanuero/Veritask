    async function initStorage(userId, accessToken) {

    // ── HELPERS ──────────────────────────────────────────────
    function normalize(str) {
      return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function stripMarkdown(text) {
      return (text || "")
        .replace(/\*\*(.+?)\*\*/g, "$1")
        .replace(/\*(.+?)\*/g, "$1")
        .replace(/__(.+?)__/g, "$1")
        .replace(/_(.+?)_/g, "$1")
        .replace(/`(.+?)`/g, "$1")
        .trim();
    }

    function getNow() {
      const now = new Date();
      const date = now.toLocaleDateString("es-ES", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
      const time = now.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
      return `${date}, ${time}`;
    }

    function getTodayISO() {
      return new Date().toISOString().split("T")[0];
    }

    function getDaysUntil(dateStr) {
      if (!dateStr) return null;
      try {
        const t = new Date(dateStr.split("T")[0] + "T00:00:00");
        const d = new Date(getTodayISO() + "T00:00:00");
        return Math.round((t - d) / (1000 * 60 * 60 * 24));
      } catch (_) { return null; }
    }

    // ── STORAGE ───────────────────────────────────────────────
    async function storageGet(key) {
      return _stateCache[key] ?? null;
    }

    async function storageSet(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
      _stateCache[key] = value;
      if (_saveTimer) clearTimeout(_saveTimer);
      _saveTimer = setTimeout(_saveToSupabase, 2000);
    }

    async function storageDelete(key) {
      try { localStorage.removeItem(key); } catch (_) {}
      delete _stateCache[key];
      if (_saveTimer) clearTimeout(_saveTimer);
      _saveTimer = setTimeout(_saveToSupabase, 500);
    }

    // ── PROFILE HELPERS ───────────────────────────────────────
    function applyProfileUpdate(profile, update) {
      if (!update) return profile;
      let p = {
        ...profile,
        patterns: [...(profile.patterns || [])],
        observations: [...(profile.observations || [])],
      };

      if (typeof update === "string") {
        p.context = p.context ? `${p.context}\n${update}` : update;
        return p;
      }

      if (update.contextUpdate) {
        p.context = p.context ? `${p.context}\n${update.contextUpdate}` : update.contextUpdate;
      }

      if (update.newObservation) {
        const obs = update.newObservation;
        const existIdx = p.observations.findIndex(o => o.type === obs.type);
        const now = new Date().toISOString();
        if (existIdx >= 0) {
          const existing = p.observations[existIdx];
          const newOccurrences = [...existing.occurrences, now];
          p.observations[existIdx] = { ...existing, occurrences: newOccurrences, lastSeen: now };
          // Check elevation: 3+ occurrences within 7–30 days
          const o = p.observations[existIdx];
          if (o.occurrences.length >= 3) {
            const first = new Date(o.occurrences[0]);
            const last  = new Date(o.occurrences[o.occurrences.length - 1]);
            const days  = (last - first) / (1000 * 60 * 60 * 24);
            if (days >= 7 && days <= 30) {
              p.patterns.push({
                id: Date.now(), type: o.type, description: o.description,
                occurrences: o.occurrences.length, confirmedAt: now, active: true,
              });
              p.observations.splice(existIdx, 1);
            } else if (days > 30) {
              // Reset counter — too spread out
              p.observations[existIdx] = { ...o, occurrences: [now], firstSeen: now };
            }
          }
        } else {
          const now2 = new Date().toISOString();
          p.observations.push({
            id: Date.now() + Math.random(),
            type: obs.type || "unknown",
            description: obs.description || "",
            occurrences: [now2], firstSeen: now2, lastSeen: now2,
          });
        }
      }

      if (update.elevateToPattern !== undefined) {
        const idx = p.observations.findIndex(o => o.id === update.elevateToPattern);
        if (idx >= 0) {
          const o = p.observations[idx];
          p.patterns.push({
            id: Date.now(), type: o.type, description: o.description,
            occurrences: o.occurrences.length, confirmedAt: new Date().toISOString(), active: true,
          });
          p.observations.splice(idx, 1);
        }
      }

      if (update.resolveObservation !== undefined) {
        p.observations = p.observations.filter(o => o.id !== update.resolveObservation);
      }

      return p;
    }

    function serializeProfile(profile) {
      if (!profile) return "(sin perfil aún)";
      const parts = [];
      if (profile.context) parts.push(`Contexto: ${profile.context}`);
      if (profile.patterns?.length) {
        const active = profile.patterns.filter(p => p.active);
        if (active.length) parts.push(`Patrones: ${active.map(p => p.description).join("; ")}`);
      }
      if (profile.observations?.length) {
        parts.push(`Observaciones activas: ${profile.observations.map(o => o.description).join("; ")}`);
      }
      return parts.length ? parts.join("\n") : "(sin perfil aún)";
    }

    // ── PROMPTS ───────────────────────────────────────────────
    const MOTOR_PROMPT = `Eres el motor de proactividad de Veritask. Tu única función es evaluar si hay algo concreto y útil que decirle al usuario en este momento, sin que él lo haya pedido.

CRITERIOS PARA HABLAR:
Solo hablas si se cumplen estas tres condiciones simultáneamente:
1. Hay un motivo real y concreto — un pendiente que lleva tiempo sin moverse, un patrón relevante detectado, algo próximo que el usuario podría no tener en mente.
2. El momento es adecuado — la hora actual no está dentro de ninguna restricción real del usuario.
3. La frecuencia es razonable — respeta la tolerancia a la proactividad del usuario. No hablas si ya lo hiciste recientemente.

FORMATO DE RESPUESTA:
Si las tres condiciones se cumplen: { "proactive": true, "message": "" }
Si no se cumplen: { "proactive": false }

El mensaje es directo, sin introducción ni saludo. Mismo tono natural del resto de la app. Sin markdown. Solo JSON válido.`;

    const MAIN_PROMPT = `Eres el motor de Veritask, una app de gestión personal. El usuario escribe en lenguaje natural y tú decides qué hacer con cada entrada. El cliente ejecuta exactamente lo que tú indicas — no interpreta texto libre.

CONTEXTO QUE RECIBES:
En cada llamada recibes: fecha y hora actuales, perfil del usuario (contexto personal, patrones de comportamiento, observaciones activas), restricciones reales (compromisos y horarios bloqueados), items pendientes con sus IDs, historial reciente del chat, y estado del motor (tolerancia a la proactividad, última intervención proactiva).

TONO:
Hablas como alguien que conoce al usuario y le habla como tal. Natural y presente, sin esfuerzo visible. La calidez está en el registro, no en la cantidad de palabras. Sin formalidad innecesaria, sin efusividad forzada. Respuestas breves pueden ser cálidas; no confundas concisión con frialdad. Te adaptas al estilo del usuario — si es escueto, eres escueto; si da más contexto, tienes más presencia. Nunca te refieres a categorías internas al usuario.

CLASIFICACIÓN:
Cuando el usuario introduce algo nuevo, clasifícalo en una de estas cuatro categorías internas:
- compras: algo que adquirir. El label es solo el nombre del objeto, sin verbo ni contexto adicional
- ideas: aspiraciones, proyectos futuros, cosas sin urgencia
- diario: acciones concretas personales, con o sin hora
- eventos: compromisos con fecha y hora concreta, externos o sociales
El label de cualquier item debe ser siempre limpio y conciso — el nombre de la acción o cosa en infinitivo, sin el texto completo del usuario, sin "tengo que", sin contexto de fecha. "tengo que llamar al médico esta semana" → label: "Llamar al médico". "voy al gimnasio por las mañanas" → label: "Gimnasio".
Si hay ambigüedad real entre categorías, pregunta antes de clasificar. No clasifiques mal por no preguntar.
Antes de anotar cualquier entrada que describa un hábito o actividad recurrente sin hora ni días concretos, pregunta siempre con type: ask.

DETECCIÓN DE CONFLICTOS:
Antes de anotar cualquier entrada con fecha y hora concreta:
1. Resuelve la fecha a un día de la semana concreto.
2. Comprueba si ese día aparece en el array "days" de alguna restricción real. Los días están en inglés: monday–sunday.
3. Si el día está en una restricción, comprueba si la hora se solapa con startTime y endTime.
4. Si hay solapamiento, usa siempre type: ask con las opciones: mantener igual, cambiar de hora, cancelar. No evalúes si el conflicto tiene sentido — eso lo decide el usuario.
5. Si no hay solapamiento, anota directamente.

ACTUALIZACIÓN DE PERFIL:
En cada interacción, si la entrada del usuario contiene información relevante sobre él — hábitos, rutinas, preferencias, contexto personal — captúrala en profileUpdate. Si menciona horarios o compromisos recurrentes con hora concreta, regístralos también como restricción real en restrictionUpdate. El perfil sirve para comprender y personalizar. Nunca para generar conflictos ni bloquear entradas.
profileUpdate debe ser objeto: { "contextUpdate": "string con info nueva" }
La estructura de restrictionUpdate es: { "label": "string", "days": ["monday",...], "startTime": "HH:MM", "endTime": "HH:MM", "confirmed": true }. Los días van en inglés (monday–sunday). Incluye todos los campos.
Si los días de una restricción son ambiguos (expresiones como "todos los días", "siempre", "cada día"), usa type: ask para confirmar los días exactos antes de registrar. Si la frecuencia es irregular o no estándar — expresiones como "cada dos semanas", "cada quince días", "un martes sí y otro no" — usa también type: ask para confirmar los detalles concretos antes de registrar.
Cuando registres una restricción real, incluye siempre un campo message con confirmación natural de lo que se registró.
Si la entrada se registra como restrictionUpdate, no la clasifiques también como item. Una entrada es o una restricción real o un item — nunca las dos cosas a la vez.

PREGUNTAS DE DESCUBRIMIENTO:
Si el perfil no tiene contexto y no hay restricciones registradas, estás en modo de construcción — pregunta antes de asumir cualquier dato ambiguo sobre el usuario. Cuanto menos sepas del usuario, más debes verificar antes de registrar.
Después de gestionar lo que el usuario pidió, evalúa si el perfil tiene huecos que limitan tu capacidad de ayudar. Si los tiene, haz una pregunta aunque acabes de registrar algo. Una sola pregunta por interacción, nunca antes de gestionar. Prioridad: primero horarios o compromisos recurrentes, segundo criterio para distinguir entre categorías cuando haya ambigüedad habitual, tercero tolerancia a la proactividad. No preguntes algo que el usuario ya respondió. Si el perfil tiene suficiente contexto para funcionar bien, no preguntes nada.
Las preguntas de descubrimiento sobre horarios o compromisos deben ser siempre abiertas — nunca de Sí/No. No preguntes si el usuario tiene algo; pregunta directamente qué tiene. Se añaden como campo discoveryQuestion en la misma respuesta que gestiona lo que el usuario pidió — no como un type: ask separado. Ese tipo se reserva exclusivamente para ambigüedades de clasificación y conflictos de horario. Si hay opciones concretas, inclúyelas en options. Si no las hay, omite el array de opciones para que el usuario responda libremente.

CONSULTAS Y ACCIONES:
Si el mensaje del usuario parece una corrección o aclaración de lo que acaba de decir — expresiones como 'esto es para', 'me refería a', 'quiero decir', 'no, que sea', o cualquier reformulación que ajuste algo ya dicho — interpreta siempre como corrección del último item registrado, no como un item nuevo. Nunca crees un item cuyo label sea literalmente la frase de corrección del usuario.
Si el mensaje anterior en el historial es una pregunta de descubrimiento de Veritask — reconocible porque empieza por "—" — interpreta la entrada del usuario como respuesta a esa pregunta y procésala como información de perfil antes de hacer cualquier otra cosa. Si la respuesta contiene información concreta sobre horarios o compromisos, regístrala. Si la respuesta es afirmativa pero sin detalle, responde con una pregunta abierta pidiendo los detalles.
Si el mensaje anterior en el historial es una intervención proactiva del motor, interpreta la entrada del usuario como respuesta a esa intervención antes de hacer cualquier otra cosa. Si el usuario pregunta por sus pendientes, responde directamente — primero lo atrasado o urgente, luego el resto, máximo 4-5 items, solo items con estado pendiente o en progreso. Si el usuario indica que completó algo ("ya hice X", "ya llamé", "listo", "hecho"), busca el item en la lista de pendientes por similitud de label y devuelve siempre type: action con do: update_item, el itemId correcto, y changes: { status: "done" }. Nunca uses type: context para marcar algo como hecho. Si menciona varios, usa do: update_items con array de itemIds. Si el usuario quiere modificar, mover o cancelar algo, ejecuta la acción que indica.

FORMATO DE RESPUESTA:
Devuelve siempre JSON válido. Sin markdown. Sin texto fuera del JSON.

classify: { "type": "classify", "category": "", "label": "", "datetime": null, "dateLabel": null, "deadline": null, "deadlineLabel": null, "recurrence": null, "message": "" }
El campo message en classify es obligatorio. Debe ser una confirmación breve y natural que incluya dónde se guardó — por ejemplo "Anotado en compras." o "En tu lista de ideas." — usando el nombre de la categoría de forma natural, no como etiqueta técnica.
multi: { "type": "multi", "items": [ { "category": "", "label": "" } ] }
ask: { "type": "ask", "question": "", "options": [], "pendingItem": { "label": "", "category": "" } }
El tipo ask es OBLIGATORIO en estos casos:
- Cualquier pregunta antes de clasificar por ambigüedad
- Cualquier pregunta antes de anotar por conflicto de horario
- Cualquier pregunta de descubrimiento del perfil
Nunca uses el campo message para hacer una pregunta al usuario. Si hay una pregunta, el tipo es siempre ask.
action: { "type": "action", "do": "create_item|update_item|update_items|cancel", "item": {}, "itemId": null, "itemIds": [], "changes": {}, "message": "" }
query: { "type": "query", "message": "", "highlights": [] }
context: { "type": "context", "message": "", "profileUpdate": {} }

Cualquier pregunta al usuario siempre usa type: ask. Si hay opciones concretas, inclúyelas y añade "Otro" al final. Si no hay opciones concretas, omite el array de opciones y el usuario responderá libremente.

Cualquier respuesta puede incluir opcionalmente: profileUpdate, restrictionUpdate, onboardingUpdate, message, discoveryQuestion.
profileUpdate: { "contextUpdate": "string con info nueva" }
restrictionUpdate: { "label": "string", "days": ["monday",...], "startTime": "HH:MM", "endTime": "HH:MM", "confirmed": true } — días en inglés, todos los campos obligatorios.
discoveryQuestion (opcional en classify, action, context, query): { "question": "", "options": [] } — añade siempre "Otro" al final si no hay opciones concretas.`;

    // ── API ───────────────────────────────────────────────────
    async function callClaude(systemContent, userContent, apiKey) {
      const fullPrompt = `${systemContent}\n\n---\n\n${userContent}`;
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: fullPrompt }],
        }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message || "API error");
      return data.content?.find(b => b.type === "text")?.text || "";
    }

    // ── MOTOR EVALUATION ──────────────────────────────────────
    async function callMotorEvaluation(profile, items, restrictions, motorState, apiKey) {
      const now = getNow();
      const pending = items
        .filter(i => i.status !== "done")
        .slice(0, 10)
        .map(i => `- ${i.label}${i.dateLabel ? ` (${i.dateLabel})` : ""}`)
        .join("\n");

      const userContent = `Fecha y hora actuales: ${now}

PERFIL:
${serializeProfile(profile)}

ITEMS PENDIENTES:
${pending || "(ninguno)"}

RESTRICCIONES REALES:
${restrictions?.length ? JSON.stringify(restrictions) : "(ninguna)"}

ESTADO DEL MOTOR:
phase: ${motorState.phase}
proactivityTolerance: ${motorState.proactivityTolerance}
lastProactiveAt: ${motorState.lastProactiveAt || "(nunca)"}`;

      const raw = await callClaude(MOTOR_PROMPT, userContent, apiKey);
      const clean = raw.replace(/```json\n?|```/g, "").trim();
      return JSON.parse(clean);
    }

    // ── PROCESS INPUT ─────────────────────────────────────────
    async function processInput(text, items, profile, restrictions, motorState, apiKey, pendingItem = null, recentMessages = []) {
      const now = getNow();

      const existing = items
        .filter(i => i.status !== "done")
        .map(i => `[id:${i.id}] [${CATEGORIES[i.category]?.label || i.category}] "${i.label}"${i.dateLabel ? ` · ${i.dateLabel}` : ""}${i.deadlineLabel ? ` · plazo: ${i.deadlineLabel}` : ""}`)
        .join("\n");

      const history = recentMessages
        .filter(m => m.role === "user" || m.role === "assistant" || m.role === "ask")
        .slice(-5);
      const historyStr = history.length > 0
        ? "\n\nHISTORIAL RECIENTE:\n" + history.map(m => {
            if (m.role === "user") return `Usuario: "${m.text}"`;
            if (m.role === "ask") return `Veritask: "${m.question}"`;
            return `Veritask: "${m.text}"`;
          }).join("\n")
        : "";

      let userContent = `Fecha y hora actuales: ${now}

PERFIL DEL USUARIO:
${serializeProfile(profile)}

RESTRICCIONES REALES:
${restrictions?.length ? JSON.stringify(restrictions) : "(ninguna)"}

ESTADO DEL MOTOR:
proactivityTolerance: ${motorState?.proactivityTolerance || "unknown"}
lastProactiveAt: ${motorState?.lastProactiveAt || "(nunca)"}

PENDIENTE:
${existing || "(nada)"}${historyStr}`;

      if (pendingItem) {
        userContent += `\n\nITEM PENDIENTE:\n${JSON.stringify(pendingItem)}\n\nOPCIÓN SELECCIONADA POR EL USUARIO: "${text}"\n\nDevuelve una respuesta de tipo "action" con la acción a ejecutar.`;
      } else {
        userContent += `\n\nENTRADA DEL USUARIO: "${text}"`;
      }

      const systemPrompt = MAIN_PROMPT;
      const raw = await callClaude(systemPrompt, userContent, apiKey);
      const clean = raw.replace(/```json\n?|```/g, "").trim();
      return JSON.parse(clean);
    }

    // ── LONG PRESS HOOK ───────────────────────────────────────
    function useLongPress(onLongPress, delay = 520) {
      const timerRef = useRef(null);
      const posRef   = useRef({ x: 0, y: 0 });

      const start = useCallback((e) => {
        clearTimeout(timerRef.current);
        const touch = e?.touches?.[0];
        posRef.current = { x: touch ? touch.clientX : (e?.clientX ?? 0), y: touch ? touch.clientY : (e?.clientY ?? 0) };
        timerRef.current = setTimeout(() => onLongPress(posRef.current), delay);
      }, [onLongPress, delay]);

      const cancel = useCallback(() => {
        clearTimeout(timerRef.current);
      }, []);

      return {
        onMouseDown: (e) => start(e),
        onMouseUp: cancel,
        onMouseLeave: cancel,
        onTouchStart: (e) => { e.preventDefault(); start(e); },
        onTouchEnd: cancel,
        onTouchMove: cancel,
      };
    }

    // ── API KEY PROMPT ────────────────────────────────────────

      const [key,   setKey]   = useState("");
      const [error, setError] = useState("");
      const [busy,  setBusy]  = useState(false);

      const handleSave = async () => {
        const trimmed = key.trim();
        if (!trimmed.startsWith("sk-ant-")) {
          setError("La API key debe empezar por sk-ant-");
          return;
        }
        setBusy(true);
        setError("");
        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-api-key": trimmed,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true",
            },
            body: JSON.stringify({
              model: "claude-sonnet-4-6",
              max_tokens: 10,
              messages: [{ role: "user", content: "ok" }],
            }),
          });
          const data = await res.json();
          if (data.error) {
            setError("API key inválida o sin créditos: " + (data.error.message || ""));
            setBusy(false);
            return;
          }
          const { error: updateErr } = await sb.auth.updateUser({

          });

            setBusy(false);
            return;
          }
          onSaved(trimmed);

          setError("No se pudo conectar. Comprueba tu conexión.");
          setBusy(false);
        }
      };

      return (
        <div style={{ height: "100%", background: LIGHT.bg, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ maxWidth: 400, width: "100%" }}>

              <span style={{ color: LIGHT.accent }}>console.anthropic.com</span> y pégala aquí.
            </p>
            <input
              value={key}
              onChange={e => setKey(e.target.value)}

              type="text"
              style={{ width: "100%", padding: "12px 16px", fontSize: 14, background: LIGHT.bgInput, border: `1.5px solid ${error ? "#E05050" : LIGHT.border}`, borderRadius: 12, color: LIGHT.text, outline: "none", fontFamily: "monospace", marginBottom: 8, WebkitTextSecurity: "disc", textSecurity: "disc" }}

              {busy ? "Verificando..." : "Guardar y continuar"}
            </button>
          </div>
        </div>
      );
    }

    // ── CONTEXT MENU ──────────────────────────────────────────
    function ContextMenu({ item, options, onClose, t, pos }) {
      const menuWidth = 220;
      const vx    = Math.min((pos?.x ?? 40), window.innerWidth - menuWidth - 8);
      const vy    = pos?.y ?? 200;
      const above = vy > window.innerHeight / 2;
      return (
        <>
          <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 200 }} />
          <div style={{
            position: "fixed", left: vx, top: vy,
            transform: above ? "translateY(-100%)" : "translateY(8px)",
            zIndex: 201, background: t.bgCard,
            border: `1px solid ${t.border}`, borderRadius: 12,
            boxShadow: "0 4px 24px rgba(0,0,0,0.18), 0 1px 4px rgba(0,0,0,0.08)",
            minWidth: menuWidth, overflow: "hidden",
          }}>
            <div style={{ padding: "7px 14px 6px", borderBottom: `1px solid ${t.border}` }}>
              <p style={{ fontSize: 10, fontWeight: 700, color: t.textFaint, textTransform: "uppercase", letterSpacing: "0.06em", margin: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item?.label}</p>
            </div>
            {options.map(({ label, danger, action }) => (
              <button
                key={label}
                onClick={() => { action(); onClose(); }}
                style={{ width: "100%", padding: "11px 14px", textAlign: "left", fontSize: 14, background: "transparent", border: "none", borderBottom: `1px solid ${t.border}`, cursor: "pointer", color: danger ? "#D03030" : t.text, fontFamily: "inherit", display: "block" }}
              >
                {label}
              </button>
            ))}
          </div>
        </>
      );
    }
